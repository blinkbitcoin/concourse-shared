groups:
- name: images
  jobs:
  - build-rust-concourse-image
  - build-nodejs-concourse-image
  - build-wincross-pipeline-image
  - build-release-pipeline-image
- name: backups
  jobs:
  - backup-org-to-gcp
jobs:
- name: build-rust-concourse-image
  serial: true
  plan:
  - get: rust-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          tag: v1.24.0-debug
        version:
          digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
      inputs:
      - name: rust-image-def
      outputs:
      - name: image
      run:
        path: /kaniko/executor
        args:
        - --dockerfile=images/rust-concourse/Dockerfile
        - --context=rust-image-def
        - --use-new-run
        - --single-snapshot
        - --cache=false
        - --no-push
        - --tar-path=image/image.tar
        - --digest-file=image/digest
  - task: prepare-image-tags
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: python
          tag: 3.11-bookworm
        version:
          digest: sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64
      inputs:
      - name: rust-image-def
      - name: image
      outputs:
      - name: image-tags
      run:
        path: python3
        args:
        - rust-image-def/images/trust/prepare-image-tags.py
        - image/digest
        - image-tags/tags
  - task: registry-snapshot
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: python
          tag: 3.11-bookworm
        version:
          digest: sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64
      inputs:
      - name: rust-image-def
      outputs:
      - name: previous
      params:
        REGISTRY_USERNAME: ((docker-creds.username))
        REGISTRY_PASSWORD: ((docker-creds.password))
      run:
        path: python3
        args:
        - rust-image-def/images/trust/registry-proof.py
        - snapshot
        - us.gcr.io/galoy-org/rust-concourse
        - trust-candidate
        - previous/digest.json
  - put: rust-image
    get_params:
      skip_download: true
    params:
      image: image/image.tar
      additional_tags: image-tags/tags
  - task: registry-verify
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: python
          tag: 3.11-bookworm
        version:
          digest: sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64
      inputs:
      - name: rust-image-def
      - name: image
      - name: rust-image
      - name: previous
      outputs:
      - name: registry-proof
      params:
        REGISTRY_USERNAME: ((docker-creds.username))
        REGISTRY_PASSWORD: ((docker-creds.password))
      run:
        path: python3
        args:
        - rust-image-def/images/trust/registry-proof.py
        - verify
        - us.gcr.io/galoy-org/rust-concourse
        - trust-candidate
        - registry-proof/digests.json
        - image/digest
        - rust-image/digest
        - previous/digest.json

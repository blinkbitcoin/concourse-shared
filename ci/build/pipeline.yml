groups:
- name: images
  jobs:
  - build-rust-concourse-image
  - build-nodejs-concourse-image
  - build-wincross-pipeline-image
  - build-release-pipeline-image
- name: backups
  jobs:
  - backup-org-to-gcp
jobs:
- name: build-rust-concourse-image
  serial: true
  plan:
  - get: rust-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
      inputs:
      - name: rust-image-def
      outputs:
      - name: image
      run:
        path: /busybox/sh
        args:
        - -ec
        - /kaniko/executor --dockerfile=images/rust-concourse/Dockerfile --context=rust-image-def --use-new-run --single-snapshot --cache=false --no-push --tar-path=image/image.tar --digest-file=image/digest && digest=$(cat image/digest) && echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' && printf 'sha256-%s\n' "${digest#sha256:}" > image/tags && cat image/digest
  - put: rust-image
    params:
      image: image/image.tar
      additional_tags: image/tags
- name: build-nodejs-concourse-image
  serial: true
  plan:
  - get: nodejs-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
      inputs:
      - name: nodejs-image-def
      outputs:
      - name: image
      run:
        path: /busybox/sh
        args:
        - -ec
        - /kaniko/executor --dockerfile=images/nodejs-concourse/Dockerfile --context=nodejs-image-def --use-new-run --single-snapshot --cache=false --no-push --tar-path=image/image.tar --digest-file=image/digest && digest=$(cat image/digest) && echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' && printf 'sha256-%s\n' "${digest#sha256:}" > image/tags && cat image/digest
  - put: nodejs-image
    params:
      image: image/image.tar
      additional_tags: image/tags
- name: build-release-pipeline-image
  serial: true
  plan:
  - get: release-pipeline-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
      inputs:
      - name: release-pipeline-image-def
      outputs:
      - name: image
      run:
        path: /busybox/sh
        args:
        - -ec
        - /kaniko/executor --dockerfile=images/release/Dockerfile --context=release-pipeline-image-def --use-new-run --single-snapshot --cache=false --no-push --tar-path=image/image.tar --digest-file=image/digest && digest=$(cat image/digest) && echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' && printf 'sha256-%s\n' "${digest#sha256:}" > image/tags && cat image/digest
  - put: release-pipeline-image
    params:
      image: image/image.tar
      additional_tags: image/tags
- name: build-wincross-pipeline-image
  serial: true
  plan:
  - get: wincross-pipeline-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
      inputs:
      - name: wincross-pipeline-image-def
      outputs:
      - name: image
      run:
        path: /busybox/sh
        args:
        - -ec
        - /kaniko/executor --dockerfile=images/wincross/Dockerfile --context=wincross-pipeline-image-def --use-new-run --single-snapshot --cache=false --no-push --tar-path=image/image.tar --digest-file=image/digest && digest=$(cat image/digest) && echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' && printf 'sha256-%s\n' "${digest#sha256:}" > image/tags && cat image/digest
  - put: wincross-pipeline-image
    params:
      image: image/image.tar
      additional_tags: image/tags
- name: backup-org-to-gcp
  plan:
  - in_parallel:
    - get: every-day-trigger
      trigger: true
    - get: pipeline-tasks
  - task: gcp-backup
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: us.gcr.io/galoy-org/galoy-dev
      inputs:
      - name: pipeline-tasks
      params:
        GOOGLE_CREDENTIALS: ((staging-gcp-creds.creds_json))
        GOOGLE_BUCKET_NAME: galoy-staging-backups
        GH_APP_ID: ((github-blinkbitcoin.github_app_id))
        GH_APP_PRIVATE_KEY: ((github-blinkbitcoin.github_app_private_key))
      run:
        path: pipeline-tasks/ci/tasks/gcp-backup.sh
resources:
- name: pipeline-tasks
  type: git
  source:
    paths:
    - ci/tasks/*
    - Makefile
    uri: git@github.com:blinkbitcoin/concourse-shared.git
    branch: main
    private_key: ((github-blinkbitcoin.private_key))
- name: nodejs-image-def
  type: git
  source:
    paths:
    - images/nodejs-concourse/Dockerfile
    - images/trust/*
    uri: git@github.com:blinkbitcoin/concourse-shared.git
    branch: main
    private_key: ((github-blinkbitcoin.private_key))
- name: nodejs-image
  type: registry-image
  source:
    tag: trust-candidate
    username: ((docker-creds.username))
    password: ((docker-creds.password))
    repository: us.gcr.io/galoy-org/nodejs-concourse
- name: rust-image-def
  type: git
  source:
    paths:
    - images/rust-concourse/Dockerfile
    - images/trust/*
    uri: git@github.com:blinkbitcoin/concourse-shared.git
    branch: main
    private_key: ((github-blinkbitcoin.private_key))
- name: rust-image
  type: registry-image
  source:
    tag: trust-candidate
    username: ((docker-creds.username))
    password: ((docker-creds.password))
    repository: us.gcr.io/galoy-org/rust-concourse
- name: release-pipeline-image
  type: registry-image
  source:
    tag: trust-candidate
    username: ((docker-creds.username))
    password: ((docker-creds.password))
    repository: us.gcr.io/galoy-org/release-pipeline
- name: release-pipeline-image-def
  type: git
  source:
    paths:
    - images/release/Dockerfile
    - images/trust/*
    uri: git@github.com:blinkbitcoin/concourse-shared.git
    branch: main
    private_key: ((github-blinkbitcoin.private_key))
- name: wincross-pipeline-image
  type: registry-image
  source:
    tag: trust-candidate
    username: ((docker-creds.username))
    password: ((docker-creds.password))
    repository: us.gcr.io/galoy-org/wincross-rust
- name: wincross-pipeline-image-def
  type: git
  source:
    paths:
    - images/wincross/Dockerfile
    - images/trust/*
    uri: git@github.com:blinkbitcoin/concourse-shared.git
    branch: main
    private_key: ((github-blinkbitcoin.private_key))
- name: every-day-trigger
  type: time
  icon: clock-outline
  source:
    interval: 24h

- name: bump-shared-files
  jobs:
  - bump-shared-files-in-mavapay-client
  - bump-shared-files-in-blink-client
  - bump-shared-files-in-blink-nostr
  - bump-shared-files-in-blink-fiat
  - bump-shared-files-in-blink-circles
  - bump-shared-files-in-blink-card
  - bump-shared-files-in-blink-lnurl-server
  - bump-shared-files-in-stablesats-rs
  - bump-shared-files-in-symphony
  - bump-shared-files-in-blink-admin-panel-private
  - bump-shared-files-in-blink-terminal
- name: images
  jobs:
  - build-rust-concourse-image
  - build-nodejs-concourse-image
  - build-wincross-pipeline-image
  - build-release-pipeline-image
- name: backups
  jobs:
  - backup-org-to-gcp
jobs:
- name: build-rust-concourse-image
  serial: true
  plan:
  - get: rust-image-def
    trigger: true
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: gcr.io/kaniko-project/executor
          tag: debug
      inputs:
      - name: rust-image-def
      outputs:
      - name: image
      run:
        path: /kaniko/executor
        args:
        - --dockerfile=images/rust-concourse/Dockerfile
        - --context=rust-image-def
        - --use-new-run
        - --single-snapshot
        - --cache=false
        - --no-push
        - --tar-path=image/image.tar
        - --digest-file=image/digest
  - put: rust-image
    params:
      image: image/image.tar

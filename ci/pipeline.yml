#@ load("@ytt:data", "data")

#@ def pipeline_image():
#@   return data.values.docker_registry + "/galoy-deployments-pipeline"
#@ end

#@ def task_image_config():
type: registry-image
source:
  username: #@ data.values.docker_registry_user
  password: #@ data.values.docker_registry_password
  repository: #@ pipeline_image()
#@ end

#@ def repo_pr_branch_resource_name(repo_name):
#@   return repo_name + "-pr-branch"
#@ end

#@ def repo_resource_name(repo_name):
#@   return repo_name + "-repo"
#@ end

#@ def enabled_repos():
#@   return data.values.src_repos if data.values.enable_shared_file_updates else {}
#@ end

groups:
#@ if data.values.enable_shared_file_updates:
- name: bump-shared-files
  jobs:
#@ for repo in enabled_repos():
  - #@ "bump-shared-files-in-" + repo
#@ end
#@ end
- name: images
  jobs:
  - build-rust-concourse-image
  - build-nodejs-concourse-image
  - build-wincross-pipeline-image
  - build-release-pipeline-image
- name: backups
  jobs:
  - backup-org-to-gcp

#@ def build_task(input_name, dockerfile):
task: build
config:
  platform: linux
  image_resource:
    type: registry-image
    source:
      repository: gcr.io/kaniko-project/executor
      tag: v1.24.0-debug
    version:
      digest: sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
  inputs:
  - name: #@ input_name
  outputs:
  - name: image
  run:
    path: /kaniko/executor
    args:
    - #@ "--dockerfile=" + dockerfile
    - #@ "--context=" + input_name
    - --use-new-run
    - --single-snapshot
    - --cache=false
    - --no-push
    - --tar-path=image/image.tar
    - --digest-file=image/digest
#@ end

#@ def prepare_image_tags(input_name):
task: prepare-image-tags
config:
  platform: linux
  image_resource:
    type: registry-image
    source:
      repository: python
      tag: 3.11-bookworm
    version:
      digest: sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64
  inputs:
  - name: #@ input_name
  - name: image
  outputs:
  - name: image-tags
  run:
    path: python3
    args:
    - #@ input_name + "/images/trust/prepare-image-tags.py"
    - image/digest
    - image-tags/tags
#@ end

#@ def registry_proof(input_name, image_name, repository, mode):
task: #@ "registry-" + mode
config:
  platform: linux
  image_resource:
    type: registry-image
    source:
      repository: python
      tag: 3.11-bookworm
    version:
      digest: sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64
  inputs:
  - name: #@ input_name
  #@ if mode == "verify":
  - name: image
  - name: #@ image_name
  - name: previous
  #@ end
  outputs:
  - name: #@ "previous" if mode == "snapshot" else "registry-proof"
  params:
    REGISTRY_USERNAME: #@ data.values.docker_registry_user
    REGISTRY_PASSWORD: #@ data.values.docker_registry_password
  run:
    path: python3
    args: #@ [input_name + "/images/trust/registry-proof.py", mode, data.values.docker_registry + "/" + repository, "trust-candidate", "previous/digest.json" if mode == "snapshot" else "registry-proof/digests.json"] + ([] if mode == "snapshot" else ["image/digest", image_name + "/digest", "previous/digest.json"])
#@ end

jobs:
- name: build-rust-concourse-image
  serial: true
  plan:
  - {get: rust-image-def, trigger: true}
  - #@ build_task("rust-image-def", "images/rust-concourse/Dockerfile")
  - #@ prepare_image_tags("rust-image-def")
  - #@ registry_proof("rust-image-def", "rust-image", "rust-concourse", "snapshot")
  - put: rust-image
    get_params: {skip_download: true}
    params:
      image: image/image.tar
      additional_tags: image-tags/tags
  - #@ registry_proof("rust-image-def", "rust-image", "rust-concourse", "verify")

- name: build-nodejs-concourse-image
  serial: true
  plan:
  - {get: nodejs-image-def, trigger: true}
  - #@ build_task("nodejs-image-def", "images/nodejs-concourse/Dockerfile")
  - #@ prepare_image_tags("nodejs-image-def")
  - #@ registry_proof("nodejs-image-def", "nodejs-image", "nodejs-concourse", "snapshot")
  - put: nodejs-image
    get_params: {skip_download: true}
    params:
      image: image/image.tar
      additional_tags: image-tags/tags
  - #@ registry_proof("nodejs-image-def", "nodejs-image", "nodejs-concourse", "verify")

- name: build-release-pipeline-image
  serial: true
  plan:
  - get: release-pipeline-image-def
    trigger: true
  - #@ build_task("release-pipeline-image-def", "images/release/Dockerfile")
  - #@ prepare_image_tags("release-pipeline-image-def")
  - #@ registry_proof("release-pipeline-image-def", "release-pipeline-image", "release-pipeline", "snapshot")
  - put: release-pipeline-image
    get_params: {skip_download: true}
    params:
      image: image/image.tar
      additional_tags: image-tags/tags
  - #@ registry_proof("release-pipeline-image-def", "release-pipeline-image", "release-pipeline", "verify")

- name: build-wincross-pipeline-image
  serial: true
  plan:
  - get: wincross-pipeline-image-def
    trigger: true
  - #@ build_task("wincross-pipeline-image-def", "images/wincross/Dockerfile")
  - #@ prepare_image_tags("wincross-pipeline-image-def")
  - #@ registry_proof("wincross-pipeline-image-def", "wincross-pipeline-image", "wincross-rust", "snapshot")
  - put: wincross-pipeline-image
    get_params: {skip_download: true}
    params:
      image: image/image.tar
      additional_tags: image-tags/tags
  - #@ registry_proof("wincross-pipeline-image-def", "wincross-pipeline-image", "wincross-rust", "verify")


#@ for repo in enabled_repos():
- name: #@ "bump-shared-files-in-" + repo
  plan:
  - in_parallel:
    - { get: shared-files, trigger: true }
    - { get: pipeline-tasks }
    - get: #@ repo_resource_name(repo)
  - task: #@ "bump-shared-files-" + repo
    config:
      platform: linux
      image_resource: #@ task_image_config()
      inputs:
      - name: shared-files
        path: repo
      - name: pipeline-tasks
      - name: #@ repo_resource_name(repo)
        path: source-repo
      outputs:
      - name: source-repo
      params:
        FEATURES: #@ data.values.src_repos[repo]
      run:
        path: pipeline-tasks/ci/tasks/bump-shared-files.sh
  - put: #@ repo_pr_branch_resource_name(repo)
    params:
      repository: source-repo
      force: true
  - task: open-source-pr
    config:
      platform: linux
      image_resource: #@ task_image_config()
      inputs:
      - name: pipeline-tasks
      - name: #@ repo_resource_name(repo)
        path: source-repo
      params:
        PR_BRANCH: #@ data.values.pr_branch
        BRANCH: #@ data.values.source_repo_branch
        GH_APP_ID: #@ data.values.github_app_id
        GH_APP_PRIVATE_KEY: #@ data.values.github_app_private_key
      run:
        path: pipeline-tasks/ci/tasks/open-pr.sh
#@ end

- name: backup-org-to-gcp
  plan:
  - in_parallel:
    - { get: every-day-trigger, trigger: true }
    - { get: pipeline-tasks }
  - task: gcp-backup
    config:
      platform: linux
      image_resource: 
        type: registry-image
        source:
          repository: us.gcr.io/galoy-org/galoy-dev
      inputs:
      - name: pipeline-tasks
      params:
        GOOGLE_CREDENTIALS: #@ data.values.staging_inception_creds 
        GOOGLE_BUCKET_NAME: #@ data.values.staging_bucket_name
        GH_APP_ID: #@ data.values.github_app_id
        GH_APP_PRIVATE_KEY: #@ data.values.github_app_private_key
      run:
        path: pipeline-tasks/ci/tasks/gcp-backup.sh

resources:
#@ if data.values.enable_shared_file_updates:
- name: shared-files
  type: git
  webhook_token: ((webhook.secret))
  source:
    paths:
    - shared/**/*
    - shared/*
    - vendir.tmpl.yml
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

#@ end
- name: pipeline-tasks
  type: git
  source:
    paths: [ci/tasks/*, Makefile]
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

#@ for repo in enabled_repos():
- name: #@ repo_pr_branch_resource_name(repo)
  type: git
  source:
    uri: #@ data.values.git_org_uri + "/" + repo + ".git"
    private_key: #@ data.values.github_private_key
    branch: #@ data.values.pr_branch
#@ end

#@ for repo in enabled_repos():
- name: #@ repo_resource_name(repo)
  type: git
  source:
    uri: #@ data.values.git_org_uri + "/" + repo + ".git"
    private_key: #@ data.values.github_private_key
    branch: #@ data.values.source_repo_branch
#@ end

- name: nodejs-image-def
  type: git
  source:
    paths: [images/nodejs-concourse/Dockerfile, images/trust/*]
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: nodejs-image
  type: registry-image
  source:
    tag: trust-candidate
    username: #@ data.values.docker_registry_user
    password: #@ data.values.docker_registry_password
    repository: #@ data.values.docker_registry + "/nodejs-concourse"

- name: rust-image-def
  type: git
  source:
    paths: [images/rust-concourse/Dockerfile, images/trust/*]
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: rust-image
  type: registry-image
  source:
    tag: trust-candidate
    username: #@ data.values.docker_registry_user
    password: #@ data.values.docker_registry_password
    repository: #@ data.values.docker_registry + "/rust-concourse"

- name: release-pipeline-image
  type: registry-image
  source:
    tag: trust-candidate
    username: #@ data.values.docker_registry_user
    password: #@ data.values.docker_registry_password
    repository: #@   data.values.docker_registry + "/release-pipeline"

- name: release-pipeline-image-def
  type: git
  source:
    paths: [images/release/Dockerfile, images/trust/*]
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: wincross-pipeline-image
  type: registry-image
  source:
    tag: trust-candidate
    username: #@ data.values.docker_registry_user
    password: #@ data.values.docker_registry_password
    repository: #@   data.values.docker_registry + "/wincross-rust"

- name: wincross-pipeline-image-def
  type: git
  source:
    paths: [images/wincross/Dockerfile, images/trust/*]
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: every-day-trigger
  type: time
  icon: clock-outline
  source:
    interval: 24h

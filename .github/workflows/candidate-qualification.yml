name: Published candidate qualification
'on':
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/candidate-qualification.yml'
      - 'qualification/**'
      - 'images/trust/**'
      - '.github/workflows/node-consumer-canary.yml'
      - 'tests/test_candidate*.py'
      - 'tests/fixtures/candidate-*'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r qualification/requirements-test.txt
      - name: Enforce qualification statement and branch coverage
        run: |
          python3 -m coverage run --branch --source=qualification -m unittest discover -s tests -p 'test_candidate*.py' -v
          python3 -m coverage report --fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-coverage
          path: .coverage
          include-hidden-files: true
  candidate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: node
            repository: nodejs-concourse
            digest: sha256:59c7e62d4354a10c0304f6c38eaa2888077f5a4db58246af6debe2d00aac0a01
            verifier: --node
          - profile: rust
            repository: rust-concourse
            digest: sha256:246625941d82e091e9ae6fab0a8ce6d128f9c76df236691b20bee17d60d4beef
            verifier: --rustup
          - profile: release
            repository: release-pipeline
            digest: sha256:64493f660b2a300534b46b060f2cb5a187dc3692106fee1922a7df98958de53f
            verifier: ''
          - profile: wincross
            repository: wincross-rust
            digest: sha256:082a75d6e7bf035df05c46b7803e232b1a4d9072368dbdfb7c224bbb2c68dbc3
            verifier: --rustup
    env:
      IMAGE: us.gcr.io/galoy-org/${{ matrix.repository }}@${{ matrix.digest }}
      PROFILE: ${{ matrix.profile }}
      VERIFIER: ${{ matrix.verifier }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the exact published artifact
        run: |
          mkdir receipts
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > receipts/resolved-digests.json
          python3 -c 'import json,os; assert os.environ["IMAGE"] in json.load(open("receipts/resolved-digests.json"))'
      - name: Recheck the artifact's own trust gates
        run: |
          set -o pipefail
          args=()
          if [ -n "$VERIFIER" ]; then args+=("$VERIFIER"); fi
          docker run --rm --platform linux/amd64 --entrypoint /usr/bin/python3 \
            "$IMAGE" /usr/local/lib/ci-trust/verify.py verify "${args[@]}" \
            2>&1 | tee receipts/artifact-trust.log
      - name: Qualify installed clients without credentials
        run: |
          set -o pipefail
          python3 qualification/chains.py > receipts/host-arguments.txt
          mapfile -t pinned_hosts < receipts/host-arguments.txt
          docker run --rm --platform linux/amd64 "${pinned_hosts[@]}" --entrypoint python3 \
            -v "$PWD/images/trust:/source/images/trust:ro" \
            -v "$PWD/qualification:/source/qualification:ro" "$IMAGE" \
            /source/qualification/clients.py qualify "$PROFILE" \
            2>&1 | tee receipts/installed-clients.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ matrix.profile }}-receipts
          path: receipts/

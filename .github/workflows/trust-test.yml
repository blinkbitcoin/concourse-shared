name: Shared image trust gates
on:
  pull_request:
    paths:
      - '.github/workflows/trust-test.yml'
      - 'images/**'
      - '.dockerignore'
      - 'ci/**'
      - 'tests/test_pipeline.py'
      - 'tests/test_trust.py'
      - 'tests/test_registry_proof.py'
      - 'tests/test_prepare_image_tags.py'
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ytt
        run: |
          curl -fsSL https://github.com/carvel-dev/ytt/releases/download/v0.52.2/ytt-linux-amd64 -o /tmp/ytt
          echo '76d5355a5135c59a1791f420f3094579f775cbf2a987328f920a05e1338f1e1f  /tmp/ytt' | sha256sum -c -
          sudo install -m 0755 /tmp/ytt /usr/local/bin/ytt
      - name: Install pinned Fly validator
        run: |
          curl -fsSL https://github.com/concourse/concourse/releases/download/v8.3.0/fly-8.3.0-linux-amd64.tgz -o /tmp/fly.tgz
          echo '0b5f660b10e1655cbde4f25d6e1683815f0e5e66983b3f77576591e73a800f43  /tmp/fly.tgz' | sha256sum -c -
          tar -xzf /tmp/fly.tgz -C /tmp fly
          sudo install -m 0755 /tmp/fly /usr/local/bin/fly
      - run: python3 -m pip install -r qualification/requirements-test.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: fly validate-pipeline -c ci/build/pipeline.yml
      - name: Verify public GCR manifest readback without credentials
        env:
          REGISTRY_USERNAME: ''
          REGISTRY_PASSWORD: ''
        run: |
          python3 images/trust/registry-proof.py snapshot gcr.io/kaniko-project/executor v1.24.0-debug /tmp/registry-proof.json
          python3 -c 'import json; assert json.load(open("/tmp/registry-proof.json"))["previous_candidate_digest"] == "sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd"'
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [nodejs-concourse, rust-concourse, release, wincross]
    steps:
      - uses: actions/checkout@v4
      - name: Qualify each complete candidate with the pinned builder
        run: |
          mkdir -p "$RUNNER_TEMP/kaniko-image"
          docker run --rm --platform linux/amd64 --entrypoint /kaniko/executor \
            -v "$PWD:/workspace/source:ro" \
            -v "$RUNNER_TEMP/kaniko-image:/workspace/image" -w /workspace \
            gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd \
            --dockerfile=images/${{ matrix.image }}/Dockerfile --context=source \
            --use-new-run --single-snapshot --cache=false --no-push \
            --tar-path=image/image.tar --digest-file=image/digest
      - name: Prepare content tag in the separate pinned runtime
        run: |
          mkdir -p "$RUNNER_TEMP/image-tags"
          docker run --rm --platform linux/amd64 --entrypoint python3 \
            -v "$PWD:/workspace/source:ro" \
            -v "$RUNNER_TEMP/kaniko-image:/workspace/image:ro" \
            -v "$RUNNER_TEMP/image-tags:/workspace/image-tags" -w /workspace \
            python@sha256:18d373e126e39c29c6d38e71e2f19ca66636568318fc95c7849c462b7f9d3d64 \
            source/images/trust/prepare-image-tags.py image/digest image-tags/tags
      - uses: actions/upload-artifact@v4
        with:
          name: kaniko-${{ matrix.image }}-digest
          path: |
            ${{ runner.temp }}/kaniko-image/digest
            ${{ runner.temp }}/image-tags/tags
